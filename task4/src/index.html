<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/styles.css">
    <title>business card</title>
</head>
<body>
    <div class="main-container">

        <div class="form-container">
            <header class="header">
                <div class="section-container">
                    <h1 class="title-header">Конструктор визиток</h1>
                </div>
            </header>
        
            <main class="section-container">
                <form action="#">
                    <div class="fields-container"> 
                        <div class="form-field">
                            <label class="label-field" for="name-organisation">Наименование организации</label>
                            <input class="input-form-field" type="text" id="name-organisation">
                        </div>
                        <div class="form-field">
                            <label class="label-field" for="name-person">Фамилия, имя, отчество</label>
                            <div class="field-config-wrapper">
                                <input class="input-form-field" type="text" id="name-person">
                                <div class="config-options"></div>
                                <div class="config-options"></div>
                            </div>
                            <div class="config-colors"></div>
                        </div>
                        
                        <div class="form-field">
                            <label class="label-field" for="post">Должность</label>
                            <div class="field-config-wrapper">
                                <input class="input-form-field" type="text" id="post">
                                <div class="config-options">
                                    <div class="config-group">
                                        <button class="config-button option-active">24px</button>
                                        <button class="config-button">24px</button>
                                    </div>
                                    <div class="config-group">
                                        <button class="config-button option-active">24px</button>
                                        <button class="config-button">24px</button>
                                    </div>
                                </div>
                            </div>
                            <div class="config-colors"></div>
                        </div>
                        <div class="form-field">
                            <label class="label-field" for="number">Телефон</label>
                            <div class="phone-list">
                                <div class="phone-item"> 
                                    <input class="input-form-field" type="text" id="number">
                                </div>
                                <div class="phone-add-wrapper">
                                    <div class="phone-add-btn"></div>
                                    <p class="phone-add-text">Добавить еще один телефон</p>
                                </div>
                            </div>
                        </div>
                        <div class="form-field">
                            <label class="label-field" for="email-">E-mail</label>
                            <div class="input-with-toggle-container">
                                <input class="input-form-field" type="text" id="email">
                                <div class="toggle-container">
                                    <input  type="checkbox" class="toggle-checkbox" id="email-checker">
                                    <label for="email-checker" class="toggle-label">Отображать</label>
                                </div>
                            </div>
                        </div>
                        <div class="form-field">
                            <label class="label-field" for="adress">Адрес</label>
                            <div class="input-with-toggle-container">
                                <input class="input-form-field"  type="text" id="adress">
                                <div class="toggle-container">
                                    <input  type="checkbox" class="toggle-checkbox" id="email-checker">
                                    <label for="email-checker" class="toggle-label">Отображать</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="submit-btn">
                        Применить
                    </button>
                </form>
            </main>
        </div>
        <div class="card-container">
            <div class="card">
                <h1>sadsad</h1>
            </div>
        </div>
    </div>

    <script type="module" src="./js/index.js"></script>
</body>
</html>
